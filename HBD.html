<!DOCTYPE html>
<html lang="ko">
<head>
      <meta charset="UTF-8">
      <title>HBD</title>
      <style>
        /* 기본 설정 */
* {
    box-sizing: border-box;
}

body {
    background-color: #f9f8f5;
    color: #171717;
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 50px auto;
    padding: 25px;
    line-height: 1.6;
}

/* 상단 메인 화면 */
header {
    background-color: #ef2eef;
    padding: 40px;
    border: 4px solid black;
    box-shadow: 10px 10px 0 black;
    margin-bottom: 65px;
}

header p {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 3px;
}

h1 {
    font-size: 50px;
    font-weight: 900;
    letter-spacing: 7px;
    margin: 25px 0;
}

h1 span {
    color: #FF3E5E;
}

/* 소제목 */
h2 {
    display: inline-block;
    background-color: #ef2eef;
    color: white;
    padding: 8px 18px;
    border: 3px solid black;
    font-size: 25px;
    box-shadow: 5px 5px 0 black;
}

/* 목록 */
ul {
    padding: 0;
    list-style: none;
}

li {
    padding: 15px;
    margin: 15px 0;
    border: 3px solid black;
    font-weight: bold;
    font-size: 18px;
}

li:nth-child(1) {
    background-color: #ebfe48;
}

li:nth-child(2) {
    background-color: #C6FF00;
}

li:nth-child(3) {
    background-color: #84fe48;
}

/* 링크 */
a {
    color: #171717;
    font-weight: bold;
    background-color: #C6FF00;
    padding: 5px;
}
/* 폭죽 캔버스 */
#fireworks {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
}
}
.intro {
    font-size: 28px;
    font-weight: 900;
    background-color: #FF3E5E;
    display: inline-block;
    padding: 15px 20px;
    border: 3px solid black;
    box-shadow: 6px 6px 0 black;
    transform: rotate(-2deg);
}


}
    </style>
</head>

<body>
    <header>
    <p>김도희의 생일을 축하합니다!</p>
    <h1>HAPPY BIRTHDAY</h1>
</header>

    <h1>우주최고귀요미스타쁘띠몽띠키티너구리도라미</h1>


    <h2>당신이 오늘 해야 할 것들</h2>
    <ul>
        <li>끝내주게 노래부르기</li>
        <li>퀸카 추기</li>
        <li>모자 쓰기</li>
    </ul>

    <h2>click me!</h2>
    <a href="https://open.spotify.com/playlist/37i9dQZF1DWYtQSOiZF6hj?si=yiFwhOWVShWtUJpdImjqug">
        Visit Smile 
    </a>

    <p>Thank you for visiting!</p>
    
    <p class="click-guide">
         화면을 클릭하면 폭죽이 터집니다! 
    </p>

    <canvas id="fireworks"></canvas>

    <script>
        // 폭죽 캔버스 설정
        const canvas = document.getElementById("fireworks");
        const ctx = canvas.getContext("2d");

        let particles = [];

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;

            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;

            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        // 폭죽 색상
        const colors = [
            "#FF2EEF",
            "#C6FF00",
            "#FF3E5E",
            "#84FE48",
            "#00E5FF",
            "#FFD700",
            "#FFFFFF"
        ];

        // 폭죽 생성
        function createFirework(x, y) {
            const color = colors[
                Math.floor(Math.random() * colors.length)
            ];

            const count = 80;

            for (let i = 0; i < count; i++) {
                const angle = Math.PI * 2 * i / count;
                const speed = Math.random() * 5 + 2;

                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    gravity: 0.045,
                    decay: Math.random() * 0.012 + 0.008
                });
            }
        }

        // 화면 클릭 감지
        document.addEventListener("click", function(event) {
            if (event.target.closest("a")) return;

            createFirework(event.clientX, event.clientY);
        });

        // 폭죽 애니메이션
        function animate() {
            ctx.clearRect(
                0, 0,
                window.innerWidth,
                window.innerHeight
            );

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];

                p.x += p.vx;
                p.y += p.vy;

                p.vy += p.gravity;
                p.vx *= 0.99;
                p.vy *= 0.99;

                p.alpha -= p.decay;

                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;

                ctx.beginPath();
                ctx.arc(
                    p.x,
                    p.y,
                    p.radius,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
